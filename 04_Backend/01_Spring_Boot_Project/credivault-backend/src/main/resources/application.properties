spring.application.name=credivault-backend

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credivault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Security debugging
logging.level.org.springframework.security=WARN

# RSA issuer private key
credivault.issuer.private-key=${CREDIVAULT_ISSUER_PRIVATE_KEY}

# Institution private-key encryption master key (32-byte Base64 value)
credivault.key-master-key=${CREDIVAULT_KEY_MASTER_KEY:${CREDIVAULT_KEY_ENCRYPTION_KEY:}}


# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for password reset links
credivault.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Institution logo storage
credivault.storage.directory=${CREDIVAULT_STORAGE_DIR:./credivault-storage}